<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; min-width: 260px;
        background: #0D1117; color: #E6EDF3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
        display: flex; flex-direction: column;
      }
      header {
        padding: 12px 16px; border-bottom: 1px solid #21262D;
        display: flex; align-items: center; justify-content: space-between;
        font-weight: 700; letter-spacing: .5px;
      }
      .muted { color: #8B949E; font-size: 11px; }
      .statusbar {
        padding: 8px 16px; display: flex; gap: 14px; flex-wrap: wrap;
        font-size: 11px; color: #8B949E; border-bottom: 1px solid #21262D;
      }
      .status-dot { color: #8B949E; }
      .status-dot.active { color: #00C896; }
      .card {
        margin: 12px 16px; padding: 12px; border-radius: 8px;
        border: 2px solid #30363D; background: #161B22;
      }
      .signal-buy { border-color: #00C896; }
      .signal-sell { border-color: #FF4757; }
      .indicators {
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
        padding: 8px 16px; font-size: 11px;
      }
      .indicators b { color: #C9D1D9; }
      .row { padding: 8px 16px; display: flex; gap: 8px; }
      button {
        flex: 1; padding: 9px 10px; border-radius: 6px; cursor: pointer;
        background: #21262D; color: #E6EDF3; border: 1px solid #30363D;
        font-family: inherit; font-size: 11px; font-weight: 600;
      }
      button:hover { background: #30363D; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: #1F6FEB; border-color: #1F6FEB; }
      button.primary:hover { background: #388BFD; }
      .log {
        margin: 8px 16px 16px; padding-top: 10px; flex: 1; overflow-y: auto;
      }
      .log .entry { padding: 5px 0; border-bottom: 1px dashed #21262D; }
      .log .time { color: #8B949E; margin-right: 8px; }
      .tag-buy { color: #00C896; font-weight: 700; }
      .tag-sell { color: #FF4757; font-weight: 700; }
      .tag-wait { color: #8B949E; font-weight: 700; }
      .hint { padding: 0 16px 16px; }
      .settings { padding: 4px 16px; border-top: 1px solid #21262D; }
      .debate { padding: 6px 16px; border-top: 1px solid #21262D; font-size: 10px; }
      .debate-title { font-weight: 700; color: #C9D1D9; padding-bottom: 4px; }
      .debate .muted { margin-bottom: 3px; line-height: 1.4; }
      .settings-title { font-weight: 700; padding: 8px 0 4px; }
      .settings label { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; }
      .settings input {
        width: 120px; background: #161B22; color: #E6EDF3;
        border: 1px solid #30363D; border-radius: 4px; padding: 4px 6px;
        font-family: inherit; font-size: 11px;
      }
      .settings textarea {
        width: 100%; background: #161B22; color: #E6EDF3;
        border: 1px solid #30363D; border-radius: 4px; padding: 6px;
        font-family: inherit; font-size: 11px; resize: vertical;
      }
    </style>
  </head>
  <body>
    <header>
      <span>AI Trading Signal</span>
      <span class="muted">XAUUSD M15</span>
    </header>

    <div class="statusbar">
      <span><span class="status-dot" id="statusDot">●</span> Status: <span id="status">…</span></span>
      <span>Last: <span id="lastAnalyze">—</span></span>
    </div>

    <div class="card" id="signalCard">
      <div id="signalText" style="font-weight:700;font-size:16px">Menunggu…</div>
      <div id="signalReason" class="muted" style="margin-top:6px">Klik "Analyze Now" untuk trigger.</div>
    </div>

    <div class="indicators" id="indicators">
      <span class="muted">—</span>
    </div>

    <div class="debate" id="debateBlock" hidden>
      <div class="debate-title">Proses Debat <span id="debateToggle" style="cursor:pointer">▾</span></div>
      <div id="debateBody">
        <div id="debateAnalyst" class="muted">—</div>
        <div id="debateCounter" class="muted">—</div>
        <div id="debateFinal" class="muted">—</div>
      </div>
    </div>

    <div class="row">
      <button id="analyzeBtn" class="primary">Analyze Now</button>
    </div>
    <div class="row">
      <button id="fillBtn">Fill Order Panel</button>
      <button id="trailBtn">Trail SL</button>
    </div>
    <div class="row">
      <button id="drawSrBtn">Gambar S/R</button>
      <button id="clearSrBtn">Hapus S/R</button>
    </div>
    <div class="row">
      <button id="drawPosBtn">Gambar Posisi</button>
      <button id="clearPosBtn">Hapus Posisi</button>
    </div>
    <div class="row">
      <button id="backfillBtn">Backfill Candle</button>
      <button id="exportBtn">Export CSV</button>
    </div>
    <div class="row">
      <button id="settingsToggleBtn">Settings</button>
    </div>

    <div class="hint muted" id="orderNote"></div>

    <div class="settings" id="settingsPanel" hidden>
      <div class="settings-title">Settings</div>
      <label>Volume (lots)<input id="setVolume" type="number" step="0.01" min="0.01" /></label>
      <label>Min SL (pips)<input id="setMinSl" type="number" step="10" min="10" max="1000" /></label>
      <label>Default SL (pips)<input id="setDefSl" type="number" step="10" min="10" max="1000" /></label>
      <label>Default TP (pips)<input id="setDefTp" type="number" step="10" min="10" max="2000" /></label>
      <label>Trail distance (pips)<input id="setTrailDist" type="number" step="10" min="10" max="1000" /></label>
      <label>Trail min improve (pips)<input id="setTrailMin" type="number" step="5" min="1" max="1000" /></label>
      <label>Model<input id="setModel" type="text" /></label>
      <label>LLM Base URL<input id="setLlmUrl" type="url" placeholder="kosong = default config.js" /></label>
      <label>LLM API Key<input id="setLlmKey" type="password" placeholder="kosong = default config.js" /></label>
      <label>Loop interval (min)<input id="setLoop" type="number" step="1" min="1" max="240" /></label>
      <div class="settings-title">Catatan Trader</div>
      <div class="muted" style="padding:0 0 4px">
        Disuntik ke prompt analis &amp; pendebat. Baris baru = 1 catatan terpisah.
      </div>
      <textarea id="setManualNote" rows="4" placeholder="Contoh:&#10;Jangan SELL sebelum-news 20:30&#10;Volume harus &gt;1.5x rata-rata sebelum entry&#10;-resistance 4143 adalah kunci; breakout baru valid di atas 4145"></textarea>
      <div class="row">
        <button id="saveSettingsBtn" class="primary">Save</button>
        <button id="resetSettingsBtn">Reset</button>
      </div>
      <div class="muted" id="settingsStatus" style="padding: 0 0 10px"></div>
    </div>

    <div class="log" id="positionsSection" style="border-top:none;margin-top:0">
      <div class="muted" style="margin-bottom:6px">Open Positions <span id="positionsAt"></span></div>
      <div id="positionsList">—</div>
    </div>

    <div class="log">
      <div class="muted" style="margin-bottom:6px">Recent Signals</div>
      <div id="logList">—</div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
