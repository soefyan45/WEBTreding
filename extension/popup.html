<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 400px; min-height: 480px; margin: 0;
        background: #0D1117; color: #E6EDF3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
      }
      header {
        padding: 12px 16px; border-bottom: 1px solid #21262D;
        display: flex; align-items: center; justify-content: space-between;
        font-weight: 700; letter-spacing: .5px;
      }
      .status-dot { color: #8B949E; }
      .status-dot.active { color: #00C896; }
      .card {
        margin: 12px 16px; padding: 12px; border-radius: 8px;
        border: 2px solid #30363D; background: #161B22;
      }
      .signal-buy { border-color: #00C896; }
      .signal-sell { border-color: #FF4757; }
      .muted { color: #8B949E; font-size: 11px; }
      .indicators {
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
        padding: 8px 16px; font-size: 11px;
      }
      .indicators b { color: #C9D1D9; }
      .row { padding: 8px 16px; display: flex; gap: 8px; }
      button {
        flex: 1; padding: 8px 10px; border-radius: 6px; cursor: pointer;
        background: #21262D; color: #E6EDF3; border: 1px solid #30363D;
        font-family: inherit; font-size: 11px; font-weight: 600;
      }
      button:hover { background: #30363D; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .log {
        margin: 12px 16px 16px; border-top: 1px solid #21262D; padding-top: 10px;
        max-height: 180px; overflow-y: auto;
      }
      .log .entry { padding: 4px 0; border-bottom: 1px dashed #21262D; }
      .log .time { color: #8B949E; margin-right: 8px; }
      .tag-buy { color: #00C896; font-weight: 700; }
      .tag-sell { color: #FF4757; font-weight: 700; }
      .tag-wait { color: #8B949E; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <span>AI Trading Signal</span>
      <span class="muted">XAUUSD M15</span>
    </header>

    <div style="padding:8px 16px;display:flex;gap:12px;font-size:11px;color:#8B949E">
      <span><span class="status-dot" id="statusDot">●</span> Status: <span id="status">…</span></span>
      <span>Last: <span id="lastAnalyze">—</span></span>
    </div>

    <div class="card" id="signalCard">
      <div id="signalText" style="font-weight:700;font-size:16px">Menunggu…</div>
      <div id="signalReason" class="muted" style="margin-top:6px">Klik "Analyze Now" untuk trigger.</div>
    </div>

    <div class="indicators" id="indicators">
      <span class="muted">—</span>
    </div>

    <div class="row">
      <button id="analyzeBtn">Analyze Now</button>
      <button id="backfillBtn">Backfill</button>
      <button id="exportBtn">Export CSV</button>
    </div>

    <div class="log">
      <div class="muted" style="margin-bottom:6px">Recent Signals</div>
      <div id="logList">—</div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
